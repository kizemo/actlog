name: PractiLog CI

# 触发条件：推送到 main，或向 main 提 PR。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # 国内 pub 镜像。维护者的开发机与 CI 都在国内网络，默认走镜像；
  # 若 runner 在境外，可在仓库 Settings -> Secrets/Variables 里覆盖这两个变量。
  PUB_HOSTED_URL: https://pub.flutter-io.cn
  FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

jobs:
  gates:
    name: 门禁 ${{ matrix.gate }}
    runs-on: ubuntu-latest
    strategy:
      # 三个门禁互不依赖：一次全挂掉看不到细节，一个挂了不影响其它门禁出结果。
      fail-fast: false
      matrix:
        include:
          - gate: G1 静态分析
            script: tools/gates/g1_analyze.ps1
          - gate: G2 单元测试
            script: tools/gates/g2_unittest.ps1
          - gate: G3 迁移与 schema 自检
            script: tools/gates/g3_migration.ps1
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 用 dart-lang/setup-dart 而不是 Flutter action：
      # 当前被门禁覆盖的 packages/core_domain 是**纯 Dart 包**（无 flutter 依赖），
      # Dart SDK 更轻更快。等 apps/ 下的 Flutter 壳子落地后，再补一个
      # subosito/flutter-action 步骤即可。
      - name: 安装 Dart SDK 3.13.7
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.7

      # G3 用 node:sqlite 实跑 SQLite，需要 Node >= 22.5（22.5 起带 --experimental-sqlite，
      # 23.4 起默认可用）。ubuntu-latest 自带的 Node 20 没有 node:sqlite，所以显式装 24。
      - name: 安装 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # packages/ 下的包都是根 pub workspace 的成员（pubspec.yaml 里带 `resolution: workspace`），
      # 在工作区成员目录里单独跑 `dart pub get` 会被 pub 直接拒绝，
      # 所以依赖解析只能在仓库根做一次；门禁脚本自身也会做同样的根级解析。
      - name: 解析工作区依赖
        run: dart pub get

      # ubuntu-latest 预装 PowerShell 7（pwsh）；门禁脚本本身兼容 PowerShell 5.1。
      - name: 运行 ${{ matrix.gate }}
        run: pwsh -NoProfile -File ${{ matrix.script }}

  summary:
    name: 门禁汇总
    runs-on: ubuntu-latest
    needs: gates
    if: always()
    steps:
      - name: 汇总门禁结论
        run: |
          echo "G1 静态分析 / G2 单元测试 / G3 迁移与 schema 自检 —— 三个门禁全绿才算通过。"
          echo "门禁脚本位于 tools/gates/，失败时会把关键错误行打到 stderr。"
          echo "详见 README.md 的「质量门禁」一节。"
